# プレフィックスを Ctrl-a に（押しやすい。任意）
unbind C-b
# set -g prefix C-a
bind C-a send-prefix

# マウス操作を有効化（スクロール・ペイン選択・リサイズができる）
set -g mouse on

set -g base-index 1
setw -g pane-base-index 1

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# 分割を直感的なキーに
bind v split-window -h   # prefix+v: 横に並べる
bind h split-window -v   # prefix+h: 下に並べる

# コピーモードを vi キーバインドに
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
set -g set-clipboard on
# Neovim とのシームレスなペイン移動（vim-tmux-navigator 連携）
# 現在のペインが Neovim を実行中かを判定する
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

# Neovim 実行中ならキーを Neovim に送り、そうでなければ隣のペインへ移動
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

# 設定の再読み込みを楽に（prefix r）
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded!"

# ===== Kanagawa Wave テーマ =====
# パレット
%hidden FUJI_WHITE="#DCD7BA"
%hidden OLD_WHITE="#C8C093"
%hidden SUMI_INK_0="#16161D"
%hidden SUMI_INK_1="#1F1F28"
%hidden SUMI_INK_3="#363646"
%hidden SUMI_INK_4="#54546D"
%hidden WAVE_BLUE_1="#223249"
%hidden WAVE_BLUE_2="#2D4F67"
%hidden CRYSTAL_BLUE="#7E9CD8"
%hidden SPRING_GREEN="#98BB6C"
%hidden CARP_YELLOW="#E6C384"
%hidden SAKURA_PINK="#D27E99"
%hidden WAVE_RED="#E46876"
%hidden ONI_VIOLET="#957FB8"

# ステータスバー本体
set -g status on
set -g status-interval 5
set -g status-position top
set -g status-justify left
set -g status-style "bg=${SUMI_INK_1},fg=${FUJI_WHITE}"

# 左側: セッション名
set -g status-left-length 40
set -g status-left "#[fg=${SUMI_INK_0},bg=${CRYSTAL_BLUE},bold] #S #[fg=${CRYSTAL_BLUE},bg=${SUMI_INK_1}] "

# 右側: 日付・時刻・ホスト名
set -g status-right-length 80
set -g status-right "#[fg=${SUMI_INK_3},bg=${SUMI_INK_1}]#[fg=${OLD_WHITE},bg=${SUMI_INK_3}] %Y-%m-%d %H:%M #[fg=${ONI_VIOLET},bg=${SUMI_INK_3}]#[fg=${SUMI_INK_0},bg=${ONI_VIOLET},bold] #h "

# ウィンドウ（非アクティブ）
setw -g window-status-style "bg=${SUMI_INK_1},fg=${OLD_WHITE}"
setw -g window-status-format " #I:#W#{?window_flags,#{window_flags}, } "

# ウィンドウ（アクティブ）
setw -g window-status-current-style "bg=${WAVE_BLUE_2},fg=${FUJI_WHITE},bold"
setw -g window-status-current-format " #I:#W#{?window_flags,#{window_flags}, } "

# ウィンドウ間の区切り
setw -g window-status-separator ""

# ペインの枠線
set -g pane-border-style "fg=${SUMI_INK_4}"
set -g pane-active-border-style "fg=${CRYSTAL_BLUE}"

# メッセージ表示（prefix r などの通知）
set -g message-style "bg=${WAVE_BLUE_1},fg=${FUJI_WHITE}"
set -g message-command-style "bg=${WAVE_BLUE_1},fg=${FUJI_WHITE}"

# コピーモード選択時のハイライト（背景に明るい青＋暗い文字でコントラストを強く）
setw -g mode-style "bg=${CRYSTAL_BLUE},fg=${SUMI_INK_0},bold"
